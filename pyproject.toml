[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[all]>=0.134.0",
    "langchain-openai>=1.1.10",
    "psycopg2-binary>=2.9.11",
    "python-dotenv>=1.2.1",
    "sqlalchemy>=2.0.47",
    "uvicorn>=0.41.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.4",
]

[tool.ruff]
line-length = 105

[tool.ruff.lint]
select = ["D"]
ignore = ["D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107", "D205"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"
